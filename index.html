<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Le vlog de Laurine et Dany</title>
</head>
<body>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&family=Nunito:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#E9D8C3; --paper:#FFFEFA; --ink:#1F2733; --ink2:#55596B; --line:#CDB79B;
  --orange:#EE8B2E; --blue:#4A9CC6; --blue2:#2F6FA3; --amber:#F6B24E;
  --hl:rgba(238,139,46,.42); --shade:#F6B06B; --bub:#FFFEFA;
  --w1:#FFCF9C; --w2:#BFE2EF; --w3:#FFC58A; --w4:#C6E5F1; --ceil:#F6F3EE; --ceil-edge:#D5CBBE; --beam:#FFFFFF; --beam-o:.26; --floor:#CDB79B; --floor-edge:#B59E82;
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .25 0 0 0 0 .3 0 0 0 0 .35 0 0 0 .55 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
  --grain-o:.15;
  --display:"Comic Neue","Comic Sans MS","Chalkboard SE",cursive,sans-serif;
  --body:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#2B2622; --paper:#3A322C; --ink:#F3E9DA; --ink2:#C8B9A6; --line:#5B4E43;
    --orange:#F59A40; --blue:#6DB6DB; --blue2:#88B5E6; --amber:#F6B24E;
    --hl:rgba(245,154,64,.45); --shade:#14100D; --bub:#3A322C;
    --w1:#6B3F1B; --w2:#1D3D5C; --w3:#5A3418; --w4:#173049; --ceil:#3A3430; --ceil-edge:#1F1B18; --beam:#FFE7A8; --beam-o:.1; --floor:#1E1915; --floor-edge:#14100D;
    --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .85 0 0 0 0 .8 0 0 0 .4 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
    --grain-o:.1;
  }
}
:root[data-theme="dark"]{
  --bg:#2B2622; --paper:#3A322C; --ink:#F3E9DA; --ink2:#C8B9A6; --line:#5B4E43;
  --orange:#F59A40; --blue:#6DB6DB; --blue2:#88B5E6; --amber:#F6B24E;
  --hl:rgba(245,154,64,.45); --shade:#14100D; --bub:#3A322C;
  --w1:#6B3F1B; --w2:#1D3D5C; --w3:#5A3418; --w4:#173049; --ceil:#3A3430; --ceil-edge:#1F1B18; --beam:#FFE7A8; --beam-o:.1; --floor:#1E1915; --floor-edge:#14100D;
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='220' height='220'%3E%3Cfilter id='g'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .85 0 0 0 0 .8 0 0 0 .4 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23g)'/%3E%3C/svg%3E");
  --grain-o:.1;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:500 15px/1.5 var(--body);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue2);outline-offset:3px;border-radius:10px}
.grain{position:fixed;inset:0;z-index:5;pointer-events:none;background-image:var(--grain);opacity:var(--grain-o)}
.app{position:relative;z-index:1;max-width:1360px;margin:0 auto;padding-inline:16px;padding-block:66px 36px}
.ceil{position:absolute;top:0;left:0;right:0;height:44px;background:var(--ceil);border-bottom:3px solid var(--ceil-edge);z-index:1;pointer-events:none}
.ceil::before{content:"";position:absolute;left:0;right:0;top:15px;height:6px;background:#6B6058;opacity:.75}
.lamp{position:absolute;top:9px;width:46px;margin-left:-23px}
.lamp>svg{display:block;position:relative;z-index:1}
.beam{position:absolute;left:50%;top:34px;width:340px;height:460px;margin-left:-170px;transform-origin:50% 0;pointer-events:none;z-index:-1;
  background:linear-gradient(to bottom,rgba(255,248,222,.95),rgba(255,248,222,.35) 45%,rgba(255,248,222,0));
  clip-path:polygon(46% 0,54% 0,100% 100%,0 100%);opacity:calc(var(--beam-o) + .22);filter:blur(7px);mix-blend-mode:soft-light}
.beam.l{transform:rotate(-14deg)}.beam.r{transform:rotate(14deg)}
.lamp::after{content:"";position:absolute;left:50%;top:26px;width:120px;height:120px;margin:-8px 0 0 -60px;border-radius:50%;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,247,214,.85),rgba(255,247,214,.28) 55%,rgba(255,247,214,0));opacity:calc(var(--beam-o) + .3);filter:blur(4px)}

.rope{position:relative;height:100px;margin-top:8px;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='100'%3E%3Cpath d='M0 70 Q65 70 120 40 Q175 70 240 70' fill='none' stroke='%237E1620' stroke-width='10' stroke-linecap='round'/%3E%3Cpath d='M0 69 Q65 69 120 39 Q175 69 240 69' fill='none' stroke='%23C42832' stroke-width='6' stroke-linecap='round'/%3E%3Cellipse cx='120' cy='95' rx='21' ry='5' fill='%239A7326'/%3E%3Crect x='115' y='32' width='10' height='63' fill='%23D9A93C' stroke='%238A6420' stroke-width='2'/%3E%3Ccircle cx='120' cy='26' r='10' fill='%23EBC24F' stroke='%238A6420' stroke-width='2'/%3E%3C/svg%3E") repeat-x center bottom;pointer-events:none}
.floor{height:26px;background:var(--floor);border-top:3px solid var(--floor-edge)}

/* hand-drawn outlines: only the frame is wobbled, never the text */
.hd{position:relative;isolation:isolate}
.hd::before{content:"";position:absolute;inset:0;z-index:-1;border:3px solid var(--ink);background:var(--paper);border-radius:14px;filter:url(#wob);pointer-events:none}

.top{display:flex;align-items:center;gap:12px 20px;flex-wrap:wrap;padding-block:20px 6px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}
.brand b{font:700 clamp(20px,4.4vw,30px)/1.1 var(--display);letter-spacing:.02em;text-transform:uppercase;text-wrap:balance}
.brand b i{font-style:normal;color:var(--orange);-webkit-text-stroke:0}
.search{flex:1 1 240px;max-width:420px;height:44px;display:flex;align-items:center;gap:10px;padding-inline:16px}
.search::before{border-radius:99px;background:var(--paper)}
.search svg{flex:none;color:var(--ink2)}
.search input{flex:1;min-width:0;height:100%;border:0;background:transparent;outline:0}
.search input::placeholder{color:var(--ink2)}
.search:focus-within::before{border-color:var(--blue2)}
.waves{height:14px;margin-top:16px;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='40' height='14'%3E%3Cpath d='M0 7 Q10 0 20 7 T40 7' fill='none' stroke='%234A9CC6' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E") repeat-x left center}
.brand svg{flex:none}
.mascot{border:0;background:none;padding:0;cursor:pointer;line-height:0;flex:none;transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.mascot:hover{transform:rotate(-7deg) scale(1.1)}
.cat-h .mini{line-height:0;margin-left:2px}
.foot-fox{position:absolute;right:9%;bottom:30px;line-height:0}
.pal{margin:28px 0 0 10px}
.pal img,.fx{display:block}
.fx{height:auto;max-width:100%;user-select:none;-webkit-user-drag:none}
.empty svg{display:block;margin:0 auto 8px}
.pl{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(20,24,32,.78)}
.pl.on{display:flex}
.pl-box{width:min(960px,100%);background:var(--paper);color:var(--ink);border:3px solid var(--ink);border-radius:18px;padding:12px 12px 14px;box-shadow:6px 6px 0 rgba(0,0,0,.35)}
.pl-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.pl-top h3{flex:1;margin:0;font:800 16px/1.3 var(--body);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-x{flex:none;width:38px;height:38px;border-radius:50%;border:2.5px solid var(--ink);background:var(--amber);color:var(--ink);font:800 20px/1 var(--body);cursor:pointer}
.pl-frame{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:10px;overflow:hidden}
.pl-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.pl-foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-top:10px;font:600 13px/1.4 var(--body);color:var(--ink2)}
.pl-foot a{color:var(--ink);font-weight:800}
.demo[hidden]{display:none}
.demo{margin:14px 0 0;padding:10px 16px;font:600 13px/1.5 var(--body);color:var(--ink2);display:inline-block}
.demo::before{border-radius:12px;border-style:dashed;border-width:2px;background:color-mix(in srgb,var(--amber) 22%,var(--paper))}

.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:44px;padding-top:26px;align-items:start}
#side{position:sticky;top:16px;display:flex;flex-direction:column;gap:6px}
.eyebrow{font:700 15px/1 var(--display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink2);margin:0 0 8px 12px}
.nav{position:relative;isolation:isolate;display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 12px;min-height:42px;border-radius:12px}
.nav::before{content:"";position:absolute;inset:0;z-index:-1;border:2.5px solid transparent;border-radius:14px;filter:url(#wob)}
.nav:hover::before{border-color:var(--line);background:color-mix(in srgb,var(--paper) 70%,transparent)}
.nav[aria-current="true"]::before{border-color:var(--ink);background:var(--paper);box-shadow:3px 4px 0 var(--shade)}
.nav[aria-current="true"]{font-weight:700}
.nav .nl{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .cnt{font:700 13px/1 var(--display);color:var(--ink2);font-variant-numeric:tabular-nums}
.num{flex:none;position:relative;width:46px;height:34px;display:grid;place-items:center;transform:rotate(var(--r,-6deg));transition:transform .25s cubic-bezier(.34,1.56,.64,1)}
.nav:hover .num,.cat-h:hover .num{transform:rotate(calc(var(--r,-6deg) * -1)) scale(1.08)}
.num>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.num .sh{fill:var(--ink);opacity:.2}.num .tp{fill:var(--c);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}.num .ts{fill:url(#tapeStripe)}
.num b{position:relative;display:grid;place-items:center;font:700 17px/1 var(--display);color:#1F2733}
.num.all{--c:var(--amber)}
.num b .paw{display:block}
.paw{display:block}

/* page title */
.mh{display:flex;align-items:flex-end;gap:16px 20px;flex-wrap:wrap;margin:6px 0 10px}
.page-h{margin:0 0 8px;display:inline-block;font:700 clamp(26px,4.2vw,42px)/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase;text-wrap:balance;padding:0 10px;background:linear-gradient(transparent 55%,var(--hl) 55% 92%,transparent 92%)}
.mh .sub{margin:0 0 4px 10px;color:var(--ink2);font-weight:600}
.grow{flex:1}
.btn{position:relative;isolation:isolate;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 20px;border:0;background:transparent;font:700 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;color:#1F2733;margin-bottom:4px}
.btn::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--orange);border:2.5px solid #1F2733;border-radius:99px;box-shadow:3px 4px 0 rgba(31,39,51,.85);filter:url(#wob)}
.btn:hover{transform:translateY(-2px) rotate(-1deg)}
.btn{transition:transform .15s}

.cat{margin:0 0 46px}
.cat-h{display:flex;align-items:center;gap:12px;margin:0 0 6px;font:700 clamp(22px,3vw,30px)/1.1 var(--display);letter-spacing:.03em;text-transform:uppercase}
.day{display:flex;align-items:center;gap:14px;margin:22px 0 18px}
.day span{font:700 20px/1.2 var(--display);letter-spacing:.06em;text-transform:uppercase;padding:0 8px;background:linear-gradient(transparent 52%,var(--hl) 52% 92%,transparent 92%)}
.day::after{content:"";flex:1;border-top:2.5px dotted var(--line)}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:30px 24px}
.card{position:relative;isolation:isolate;display:block;padding:10px 10px 14px;color:inherit;transition:transform .25s cubic-bezier(.34,1.56,.64,1);transform:rotate(var(--r,0deg))}
.card::before{content:"";position:absolute;inset:0;z-index:-1;background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:5px 6px 0 var(--shade);filter:url(#wob)}
.card:nth-child(3n+1){--r:-.7deg}.card:nth-child(3n+2){--r:.5deg}.card:nth-child(3n){--r:-.2deg}
a.card:hover,a.card:focus-visible{transform:rotate(-1deg) translateY(-7px) scale(1.02)}
.thumb{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;border:2px solid var(--ink);display:grid;place-items:center;
  background:radial-gradient(120% 95% at 18% 12%,color-mix(in srgb,var(--c) 62%,var(--paper)) 0,color-mix(in srgb,var(--c) 26%,var(--paper)) 72%)}
.thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.ico{position:relative;width:48px;height:48px;border-radius:50%;background:var(--paper);border:3px solid var(--ink);display:grid;place-items:center}
.ico::after{content:"";width:16px;height:18px;background:var(--ink);clip-path:polygon(14% 4%,96% 50%,14% 96%);margin-left:4px}
.soon{position:absolute;left:8px;top:8px;font:700 12px/1 var(--display);letter-spacing:.08em;text-transform:uppercase;background:var(--amber);color:#1F2733;border:2px solid #1F2733;padding:4px 7px;border-radius:99px;transform:rotate(-3deg)}
.card h3{margin:12px 4px 2px;font:700 16px/1.3 var(--body);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-word}
.note{margin:0 4px;font-size:13px;color:var(--ink2)}

.pdc{margin:24px 0 0}
.pdc>summary{list-style:none;cursor:pointer;display:inline-flex;align-items:center;gap:10px;padding:8px 16px;font:700 15px/1 var(--display);letter-spacing:.06em;text-transform:uppercase;border:2.5px dashed var(--ink2);border-radius:99px;background:color-mix(in srgb,var(--paper) 70%,transparent);user-select:none}
.pdc>summary::-webkit-details-marker{display:none}
.pdc>summary::after{content:"";width:8px;height:8px;border-right:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
.pdc[open]>summary::after{transform:rotate(-135deg) translateY(-2px)}
.pdc>summary:hover{border-color:var(--ink)}
.pdc .grid{margin-top:22px;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:24px 18px}
.pdc .card h3{font-size:14px}
.empty{position:relative;isolation:isolate;padding:40px 28px;text-align:center;max-width:560px}
.empty::before{content:"";position:absolute;inset:0;z-index:-1;border:2.5px dashed var(--ink2);border-radius:26px;background:color-mix(in srgb,var(--paper) 75%,transparent);filter:url(#wob)}
.empty h2{margin:0 0 6px;font:700 26px/1.15 var(--display);letter-spacing:.04em;text-transform:uppercase}
.empty p{margin:0;color:var(--ink2)}

@media (max-width:820px){
  .shell{grid-template-columns:minmax(0,1fr);gap:18px;padding-top:16px}
  #side{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding:4px 4px 10px}
  #side .eyebrow,#side .pal{display:none}
  .foot-fox{right:4%}
  .foot-fox img{width:84px;height:auto}
  .lamp:nth-child(2n){display:none}
  .nav{width:auto;flex:none}
  .nav .cnt{display:none}
  .grid,.pdc .grid{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:24px 16px}
  .top .search{order:3;max-width:none;flex-basis:100%}
}
@media (prefers-reduced-motion:reduce){.card,.btn{transition:none}a.card:hover,a.card:focus-visible,.btn:hover{transform:none}}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs><pattern id="tapeStripe" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="2.4" height="6" fill="#fff" opacity=".32"/></pattern></defs>
  <filter id="wob" x="-4%" y="-4%" width="108%" height="108%">
    <feTurbulence type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="7" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>

</svg>
<div class="grain"></div>

<div class="app">
  <header class="top">
    <div class="brand">
      <button id="brandfox" class="mascot" type="button" aria-label="Changer l'humeur du renard"></button>
      <b>Le vlog de <i>Laurine et Dany</i></b>
    </div>
    <label class="search hd">
      <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="7" cy="7" r="5"/><path d="M11 11l3.5 3.5"/></svg>
      <input id="q" type="search" placeholder="Chercher une vidéo" aria-label="Chercher une vidéo" autocomplete="off">
    </label>
  </header>
  <div class="waves" aria-hidden="true"></div>
  <p class="demo hd" id="demo" hidden>Aperçu : les vidéos apparaissent ici dès que leurs liens sont ajoutés.</p>

    <nav id="side" aria-label="Chapitres"></nav>
    <main id="main"></main>
  </div>
</div>
<div class="rope" aria-hidden="true"><div class="foot-fox" id="footfox"></div></div>
<div class="floor" aria-hidden="true"></div>

    <div class="pl-frame" id="pl-f"></div>

  </div>
</div>

var SCISSORS='<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M8.5 7.7 20 18M8.5 16.3 20 6"/></svg>';
function isPdc(v){return /pdc/i.test(v.title)}
var cats=DATA.categories;
function count(c){return c.groups.reduce(function(a,g){return a+g.videos.length},0)}
var total=cats.reduce(function(a,c){return a+count(c)},0);
if(DATA.demo)$('#demo').hidden=false;

function renderSide(){
  var item=function(k,label,n,num,ci){return '<button class="nav" type="button" data-k="'+k+'"'+(S.sel===k?' aria-current="true"':'')+'>'+tape(num,ci,!num)+'<span class="nl">'+esc(label)+'</span><span class="cnt">'+n+'</span></button>'};
  var h='<p class="eyebrow">Chapitres</p>'+item('all','Tout voir',total,0,0);
  cats.forEach(function(c,i){h+=item(String(i),c.name,count(c),i+1,i)});
  h+='<div class="pal">'+fox({emo:S.sel==='all'?'content':MAP[+S.sel%MAP.length],w:150})+'</div>';
  $('#side').innerHTML=h;
}
function card(v,ci){
  var url=safe(v.url),th=url?thumbUrl(url):'',c=colOf(ci);
  var inner='<div class="thumb" style="--c:'+c+'"><span class="ico"></span>'+(th?'<img src="'+esc(th)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'')+(url?'':'<span class="soon">Bientôt</span>')+'</div><h3>'+esc(v.title)+'</h3>'+(v.note?'<p class="note">'+esc(v.note)+'</p>':'');
  return url?'<a class="card" href="'+esc(url)+'" target="_blank" rel="noopener">'+inner+'</a>':'<div class="card">'+inner+'</div>';
}
function catBlock(c,ci,q,withHead){
  var groups=c.groups.map(function(g){
    var vs=g.videos.filter(function(v){return !q||(v.title+' '+(v.note||'')).toLowerCase().indexOf(q)>-1});
    return {label:g.label,videos:vs};
  }).filter(function(g){return g.videos.length});
  if(!groups.length)return '';
  var h='<section class="cat">';
  if(withHead)h+='<h2 class="cat-h">'+tape(ci+1,ci)+esc(c.name)+'<span class="mini">'+fox({emo:MAP[ci%MAP.length],head:true,w:54})+'</span></h2>';
  groups.forEach(function(g){
    if(g.label)h+='<h3 class="day"><span>'+esc(g.label)+'</span></h3>';
    var main=g.videos.filter(function(v){return !isPdc(v)}),cut=g.videos.filter(isPdc);
    if(main.length)h+='<div class="grid" style="margin-top:'+(g.label?0:18)+'px">'+main.map(function(v){return card(v,ci)}).join('')+'</div>';
    if(cut.length)h+='<details class="pdc"'+(q||!main.length?' open':'')+'><summary>'+SCISSORS+'Plans de coupe · '+cut.length+'</summary><div class="grid">'+cut.map(function(v){return card(v,ci)}).join('')+'</div></details>';
  });
  return h+'</section>';
}
function renderMain(){

  var shown=0,cutN=0;

  var h='<div class="mh"><div><h1 class="page-h">'+esc(one?one.name:'Toutes les vidéos')+'</h1><p class="sub">'+shown+' '+plural(shown,'vidéo','vidéos')+(cutN?' · dont '+cutN+' '+plural(cutN,'plan de coupe','plans de coupe'):'')+(q?' · filtre « '+esc(S.q.trim())+' »':'')+'</p></div><span class="grow"></span>';
  var link=one&&safe(one.url);
  if(link)h+='<a class="btn" href="'+esc(link)+'" target="_blank" rel="noopener">Ouvrir le dossier</a>';
  h+='</div>';
  var body='';
  if(one)body=catBlock(one,ci,q,false);
  else cats.forEach(function(c,i){body+=catBlock(c,i,q,true)});
  if(!body){
    h+='<div class="empty">'+fox({emo:q?'triste':'endormi',w:120})+'<h2>'+(q?'Rien trouvé':'Bientôt !')+'</h2><p>'+(q?'Aucune vidéo ne correspond à « '+esc(S.q.trim())+' ».':'Les vidéos de cette partie arrivent très vite.')+'</p></div>';
  }else h+=body;
  $('#main').innerHTML=h;
}
function render(){renderSide();renderMain()}
$('#side').addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(b){S.sel=b.dataset.k;render();window.scrollTo({top:0})}});
$('#q').addEventListener('input',function(e){S.q=e.target.value;renderMain()});
$('#main').addEventListener('error',function(e){if(e.target.tagName==='IMG')e.target.remove()},true);
var mood=0;
function paintMascot(){$('#brandfox').innerHTML=fox({emo:MOODS[mood],head:true,w:56})}
$('#brandfox').addEventListener('click',function(){mood=(mood+1)%MOODS.length;paintMascot()});
paintMascot();
$('#footfox').innerHTML=fox({emo:'clin',w:118});

var PL=$('#pl');
function driveId(u){var m=String(u).match(/\/d\/([\w-]{10,})/);return m?m[1]:''}
function openPlayer(url,title){
  var id=driveId(url);if(!id){window.open(url,'_blank','noopener');return}
  $('#pl-t').textContent=title;$('#pl-a').href=url;
  $('#pl-f').innerHTML='<iframe src="https://drive.google.com/file/d/'+id+'/preview" allow="autoplay; fullscreen" allowfullscreen referrerpolicy="no-referrer" title="'+esc(title)+'"></iframe>';
  PL.hidden=false;PL.classList.add('on');document.body.style.overflow='hidden';$('#pl-x').focus();
}
function closePlayer(){PL.classList.remove('on');PL.hidden=true;$('#pl-f').innerHTML='';document.body.style.overflow=''}
$('#main').addEventListener('click',function(e){
  var a=e.target.closest('a.card');
  if(!a||e.ctrlKey||e.metaKey||e.shiftKey||e.button)return;
  e.preventDefault();openPlayer(a.getAttribute('href'),a.querySelector('h3').textContent);
});
$('#pl-x').addEventListener('click',closePlayer);
PL.addEventListener('click',function(e){if(e.target===PL)closePlayer()});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&PL.classList.contains('on'))closePlayer()});
render();
})();
</script>

</body>
</html>
